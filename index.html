<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بزمِ جون — جون ایلیا</title>
<meta name="description" content="بزمِ جون — جون ایلیا کی شاعری اور ادبی دنیا">
<style>
:root{--paper:#f4ead6;--ink:#24231f;--olive:#59633b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
main{min-height:100vh;display:grid;place-items:center;padding:28px}
.card{width:min(760px,100%);text-align:center;border:2px solid var(--olive);border-radius:28px;padding:clamp(28px,6vw,64px);background:rgba(255,255,255,.22)}
.mark{font-size:clamp(46px,9vw,86px);color:var(--olive);margin:0 0 12px}
h1{font-size:clamp(48px,10vw,88px);margin:0 0 16px;font-weight:500}
p{font-size:clamp(20px,4vw,28px);line-height:2;margin:10px 0}
a{display:inline-block;margin-top:24px;color:var(--olive);font-size:18px;text-decoration:none;border-bottom:1px solid}
footer{margin-top:36px;font-size:14px;color:#69634f}
</style>
</head>
<body>
<main><section class="card">
<div class="mark">❀</div>
<h1>بزمِ جون</h1>
<p>جون ایلیا</p>
<p>لفظوں، احساسات اور خیالوں کی ایک ادبی محفل۔</p>
<a href="https://www.rekhta.org/poets/jaun-eliya">جون ایلیا کی شاعری پڑھیں</a>
<footer>بزمِ جون — ایک ادبی گوشہ</footer>
</section></main>
</body>
</html>
